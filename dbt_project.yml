name: revenue_warehouse
version: "1.0.0"
config-version: 2
profile: revenue_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Data is "as of" this date: used for AR aging of open claims
  as_of_date: "2026-01-31"

seeds:
  revenue_warehouse:
    +schema: raw
    raw_claims:
      +column_types:
        cpt_code: varchar
        claim_status: varchar

models:
  revenue_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      core:
        +schema: core
      finance:
        +schema: finance
